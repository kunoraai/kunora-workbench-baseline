name: M1 engineering foundation
on: [push, pull_request]
jobs:
  contracts-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r docs/contracts/requirements-contracts.txt
      - run: python docs/contracts/validate_contracts.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0', components: 'rustfmt,clippy' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --locked
  contract-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0' }
      - run: cargo test -p dshd-contract --test drift_gate --locked
      - run: cargo run --locked -p conformance-runner -- --self-test
      - run: cargo run --locked -p fake-harness -- --self-test
      - run: cargo run --locked -p reference-stub -- --self-test
      - run: cargo run --locked -p capability-report -- --self-test
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [contracts-source, quality, contract-assets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dshd:m1 .
      - run: docker run --rm dshd:m1 --version
