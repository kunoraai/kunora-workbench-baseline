name: M1 engineering foundation
on: [push, pull_request]
jobs:
  contracts-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r docs/contracts/requirements-contracts.txt
      - run: python docs/contracts/validate_contracts.py
  contract-generate:
    runs-on: ubuntu-latest
    needs: contracts-source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0' }
      - run: python docs/contracts/validate_contracts.py
      - run: cargo run --locked -p contract-gen -- --regen
      - run: cargo run --locked -p contract-gen -- --check
      - run: cargo test --locked -p dshd-contract --test drift_gate
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0', components: rustfmt }
      - run: cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0', components: clippy }
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0' }
      - run: cargo check --workspace --all-targets --locked
  test:
    runs-on: ubuntu-latest
    needs: contract-generate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0' }
      - run: cargo test --workspace --locked
  contract-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: '1.89.0' }
      - run: |
          for p in conformance-runner fake-harness reference-stub capability-report; do cargo run --locked -p "$p" -- --version; cargo run --locked -p "$p" -- --self-test; done
      - uses: actions/upload-artifact@v4
        with: { name: contract-assets, path: 'tools/**/vectors.csv' }
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [fmt, clippy, check, test, contract-assets]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dshd:m1 .
      - run: docker run --rm dshd:m1 --version
