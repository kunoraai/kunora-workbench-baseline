[workspace]
resolver = "2"
members = [
  "crates/dshd",
  "crates/dshd-core",
  "crates/dshd-contract",
  "crates/dshd-adapters",
  "crates/canonical-json",
  "tools/conformance-runner",
  "tools/fake-harness",
  "tools/reference-stub",
  "tools/capability-report",
  "tools/contract-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
